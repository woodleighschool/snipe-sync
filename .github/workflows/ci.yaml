---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  checks:
    name: Build Success
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: --locked go golangci-lint go:golang.org/x/vuln/cmd/govulncheck jactionlint

      - name: Resolve Go cache
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

      - name: Check Go formatting
        run: mise run fmt-check

      - name: Check Go module tidiness
        run: mise run tidy-check

      - name: Run Go lint
        run: mise run lint

      - name: Regenerate committed artifacts
        run: mise run generate

      - name: Check generated artifacts are committed
        run: |
          generated_status=$(git status --short --untracked-files=all -- snipe-sync.schema.json)
          test -z "$generated_status" || {
            printf '%s\n' "$generated_status"
            git diff -- snipe-sync.schema.json
            exit 1
          }

      - name: Run Go tests
        run: mise run test

      - name: Build application
        run: mise run build

      - name: Check vulnerabilities
        run: mise run vulncheck
